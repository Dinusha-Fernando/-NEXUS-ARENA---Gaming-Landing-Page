<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-valk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0805" />
      <stop offset="50%" stop-color="#140f09" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="amber-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="solar-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#bg-valk)" />

  <!-- High Altitude Star & Horizon Lines -->
  <line x1="0" y1="520" x2="600" y2="520" stroke="#F59E0B" stroke-width="1" opacity="0.2" />
  <circle cx="300" cy="360" r="240" fill="#F59E0B" opacity="0.1" filter="url(#solar-glow)" />

  <!-- Valkyrie Character & Jet Wings -->
  <g transform="translate(300, 400)">
    <!-- Aerodynamic Jet Wings (Spanning Wide) -->
    <!-- Left Wing -->
    <polygon points="-40,-60 -240,-180 -180,-120 -80,-10" fill="#1f1811" stroke="#F59E0B" stroke-width="2.5" />
    <!-- Wing Thruster Trails -->
    <line x1="-240" y1="-180" x2="-280" y2="-210" stroke="#F59E0B" stroke-width="4" filter="url(#solar-glow)" />
    <line x1="-180" y1="-120" x2="-210" y2="-140" stroke="#F59E0B" stroke-width="3" filter="url(#solar-glow)" />

    <!-- Right Wing -->
    <polygon points="40,-60 240,-180 180,-120 80,-10" fill="#1f1811" stroke="#F59E0B" stroke-width="2.5" />
    <!-- Wing Thruster Trails -->
    <line x1="240" y1="-180" x2="280" y2="-210" stroke="#F59E0B" stroke-width="4" filter="url(#solar-glow)" />
    <line x1="180" y1="-120" x2="210" y2="-140" stroke="#F59E0B" stroke-width="3" filter="url(#solar-glow)" />

    <!-- Sleek High-Mobility Body -->
    <polygon points="-45,-100 45,-100 35,60 -35,60" fill="#18130d" stroke="#F59E0B" stroke-width="2" />
    <!-- Solar Core Reactor -->
    <circle cx="0" cy="-30" r="22" fill="#050508" stroke="#F59E0B" stroke-width="3" />
    <circle cx="0" cy="-30" r="14" fill="url(#amber-core)" filter="url(#solar-glow)" />

    <!-- Visor & Flight Helmet -->
    <polygon points="-25,-120 25,-120 18,-185 0,-200 -18,-185" fill="#292015" stroke="#F59E0B" stroke-width="2" />
    <polygon points="-20,-165 20,-165 15,-145 -15,-145" fill="#F59E0B" filter="url(#solar-glow)" />

    <!-- Long Rail-Sniper (Held diagonally) -->
    <g transform="rotate(-35)">
      <rect x="-10" y="-180" width="20" height="260" rx="3" fill="#14100b" stroke="#F59E0B" stroke-width="2" />
      <line x1="0" y1="-180" x2="0" y2="-240" stroke="#F59E0B" stroke-width="4" filter="url(#solar-glow)" />
      <!-- Scope -->
      <rect x="8" y="-90" width="16" height="50" rx="3" fill="#292015" stroke="#F59E0B" stroke-width="1.5" />
      <circle cx="16" cy="-65" r="5" fill="#F59E0B" filter="url(#solar-glow)" />
    </g>

    <!-- Lower Limbs / Thruster Boots -->
    <polygon points="-30,60 -10,60 -12,250 -35,250" fill="#1c160f" stroke="#F59E0B" stroke-width="2" />
    <polygon points="30,60 10,60 12,250 35,250" fill="#1c160f" stroke="#F59E0B" stroke-width="2" />
    <polygon points="-30,250 -17,250 -23,285" fill="#F59E0B" filter="url(#solar-glow)" />
    <polygon points="30,250 17,250 23,285" fill="#F59E0B" filter="url(#solar-glow)" />
  </g>

  <!-- Flight Telemetry HUD -->
  <g font-family="monospace" font-size="11" fill="#F59E0B" opacity="0.85">
    <text x="40" y="60">CALLSIGN // VALKYRIE</text>
    <text x="40" y="80" fill="#A1A1AA">ALTITUDE // 420M HOVER LOCK</text>
    <text x="40" y="100">RAILGUN CHARGE // 100%</text>
    <text x="560" y="60" text-anchor="end">RANGE // 1,200M OPTICS</text>
    <text x="560" y="80" text-anchor="end" fill="#A1A1AA">HEADSHOT LETHALITY // VERIFIED</text>
  </g>
</svg>
