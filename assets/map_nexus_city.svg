<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-city" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d" />
      <stop offset="60%" stop-color="#08101f" />
      <stop offset="100%" stop-color="#030408" />
    </linearGradient>
    <filter id="city-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-city)" />

  <!-- Grid of Neon High-Rises -->
  <!-- Background Skyline -->
  <polygon points="50,450 50,150 110,120 110,450" fill="#0c1628" />
  <polygon points="120,450 120,200 170,180 170,450" fill="#080e1a" />
  <polygon points="180,450 180,90 260,90 260,450" fill="#101c33" stroke="#00E5FF" stroke-width="1" opacity="0.8" />
  <polygon points="270,450 270,220 330,220 330,450" fill="#0a1222" />
  <!-- Central Mega-Spire (Alpha Core) -->
  <polygon points="360,450 360,40 400,10 440,40 440,450" fill="#142442" stroke="#00E5FF" stroke-width="2" />
  <line x1="400" y1="10" x2="400" y2="450" stroke="#00E5FF" stroke-width="2" filter="url(#city-glow)" />

  <polygon points="460,450 460,140 540,110 540,450" fill="#0e1b30" />
  <polygon points="550,450 550,180 620,160 620,450" fill="#101d36" stroke="#7C3AED" stroke-width="1" />
  <polygon points="630,450 630,80 720,80 720,450" fill="#0b1324" />

  <!-- Multi-Level Connecting Skybridges -->
  <line x1="110" y1="230" x2="180" y2="230" stroke="#00E5FF" stroke-width="4" filter="url(#city-glow)" />
  <line x1="260" y1="170" x2="360" y2="170" stroke="#FF2D75" stroke-width="4" filter="url(#city-glow)" />
  <line x1="440" y1="200" x2="550" y2="200" stroke="#00E5FF" stroke-width="4" filter="url(#city-glow)" />
  <line x1="540" y1="280" x2="630" y2="280" stroke="#7C3AED" stroke-width="4" filter="url(#city-glow)" />

  <!-- Flying Vehicles / Kinetic Light Streaks -->
  <line x1="80" y1="290" x2="720" y2="340" stroke="#00E5FF" stroke-width="2" stroke-dasharray="30 40" opacity="0.6" />
  <line x1="720" y1="120" x2="100" y2="160" stroke="#FF2D75" stroke-width="2" stroke-dasharray="40 50" opacity="0.6" />

  <!-- Tactical Nodes & Markers -->
  <g transform="translate(400, 200)">
    <circle cx="0" cy="0" r="14" fill="#050508" stroke="#00E5FF" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#00E5FF" filter="url(#city-glow)" />
    <text x="0" y="28" fill="#00E5FF" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">OBJECTIVE A // CORE</text>
  </g>
  <g transform="translate(220, 260)">
    <circle cx="0" cy="0" r="12" fill="#050508" stroke="#FF2D75" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#FF2D75" filter="url(#city-glow)" />
    <text x="0" y="24" fill="#FF2D75" font-family="monospace" font-size="9" text-anchor="middle">SKYBRIDGE B</text>
  </g>

  <!-- HUD Telemetry -->
  <rect x="20" y="20" width="220" height="40" rx="4" fill="rgba(8, 16, 31, 0.85)" stroke="#00E5FF" stroke-width="1" />
  <text x="32" y="38" fill="#00E5FF" font-family="monospace" font-size="10" font-weight="bold">SECTOR // 01-ALPHA</text>
  <text x="32" y="52" fill="#A1A1AA" font-family="monospace" font-size="9">NEXUS METROPLEX • RAIN 18°C</text>
</svg>
