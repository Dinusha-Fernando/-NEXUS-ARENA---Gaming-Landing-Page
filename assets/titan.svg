<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-titan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080811" />
      <stop offset="50%" stop-color="#0d111a" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <linearGradient id="cyan-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#007799" />
    </linearGradient>
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 229, 255, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="url(#bg-titan)" />
  <rect width="600" height="800" fill="url(#grid-pattern)" />

  <!-- Atmospheric Glow -->
  <circle cx="300" cy="400" r="220" fill="#00E5FF" opacity="0.12" filter="url(#cyan-glow)" />

  <!-- Mechanical Heavy Chassis Silhouette -->
  <g transform="translate(300, 420)">
    <!-- Back Thrusters & Heavy Hydraulics -->
    <rect x="-140" y="-180" width="50" height="180" rx="8" fill="#1b2230" stroke="#00E5FF" stroke-width="2" opacity="0.8" />
    <rect x="90" y="-180" width="50" height="180" rx="8" fill="#1b2230" stroke="#00E5FF" stroke-width="2" opacity="0.8" />
    <!-- Exhaust Plasma Emitters -->
    <polygon points="-130,-180 -100,-180 -115,-230" fill="#00E5FF" opacity="0.7" filter="url(#cyan-glow)" />
    <polygon points="100,-180 130,-180 115,-230" fill="#00E5FF" opacity="0.7" filter="url(#cyan-glow)" />

    <!-- Heavy Shoulder Armor Assemblies -->
    <polygon points="-180,-120 -60,-150 -70,-50 -170,-40" fill="#242c3d" stroke="#38455c" stroke-width="3" />
    <polygon points="180,-120 60,-150 70,-50 170,-40" fill="#242c3d" stroke="#38455c" stroke-width="3" />
    <line x1="-160" y1="-100" x2="-80" y2="-120" stroke="#00E5FF" stroke-width="3" filter="url(#cyan-glow)" />
    <line x1="160" y1="-100" x2="80" y2="-120" stroke="#00E5FF" stroke-width="3" filter="url(#cyan-glow)" />

    <!-- Torso Heavy Armor Plates -->
    <polygon points="-75,-140 75,-140 90,20 60,110 -60,110 -90,20" fill="#141a24" stroke="#00E5FF" stroke-width="3" />

    <!-- Arc Reactor Core -->
    <circle cx="0" cy="-20" r="45" fill="#050508" stroke="#00E5FF" stroke-width="4" />
    <circle cx="0" cy="-20" r="32" fill="url(#cyan-core)" filter="url(#cyan-glow)" />
    <polygon points="0,-45 22,-20 0,5 -22,-20" fill="#ffffff" opacity="0.9" />

    <!-- Mechanical Visor & Heavy Helm -->
    <polygon points="-40,-160 40,-160 30,-220 0,-240 -30,-220" fill="#2d3748" stroke="#00E5FF" stroke-width="2" />
    <rect x="-25" y="-195" width="50" height="12" rx="4" fill="#00E5FF" filter="url(#cyan-glow)" />

    <!-- Heavy Arm Assemblies -->
    <rect x="-160" y="-30" width="45" height="160" rx="8" fill="#1e2430" stroke="#3a475d" stroke-width="2" />
    <rect x="115" y="-30" width="45" height="160" rx="8" fill="#1e2430" stroke="#3a475d" stroke-width="2" />

    <!-- Vulcan Rotary Barrel Assembly (Right Arm) -->
    <g transform="translate(140, 130)">
      <circle cx="0" cy="0" r="28" fill="#0c1017" stroke="#00E5FF" stroke-width="2" />
      <circle cx="0" cy="-14" r="7" fill="#1e2430" stroke="#00E5FF" stroke-width="1.5" />
      <circle cx="12" cy="-7" r="7" fill="#1e2430" stroke="#00E5FF" stroke-width="1.5" />
      <circle cx="12" cy="7" r="7" fill="#1e2430" stroke="#00E5FF" stroke-width="1.5" />
      <circle cx="0" cy="14" r="7" fill="#1e2430" stroke="#00E5FF" stroke-width="1.5" />
      <circle cx="-12" cy="7" r="7" fill="#1e2430" stroke="#00E5FF" stroke-width="1.5" />
      <circle cx="-12" cy="-7" r="7" fill="#1e2430" stroke="#00E5FF" stroke-width="1.5" />
    </g>

    <!-- Hydraulic Legs & Greaves -->
    <polygon points="-65,115 -20,115 -25,260 -75,260" fill="#1e2430" stroke="#3a475d" stroke-width="2" />
    <polygon points="65,115 20,115 25,260 75,260" fill="#1e2430" stroke="#3a475d" stroke-width="2" />
    <!-- Stomp Foot Base -->
    <rect x="-90" y="255" width="70" height="25" rx="5" fill="#141a24" stroke="#00E5FF" stroke-width="2" />
    <rect x="20" y="255" width="70" height="25" rx="5" fill="#141a24" stroke="#00E5FF" stroke-width="2" />
  </g>

  <!-- Telemetry & HUD Overlays -->
  <g font-family="monospace" font-size="12" fill="#00E5FF" opacity="0.85">
    <text x="40" y="60">UNIT // TITAN-09</text>
    <text x="40" y="80" fill="#A1A1AA">CLASS // JUGGERNAUT SIEGE</text>
    <text x="40" y="100" fill="#00E5FF">CORE INTEGRITY // 100%</text>
    <text x="440" y="60" text-anchor="end">SHIELD // 4,200 HP</text>
    <text x="440" y="80" text-anchor="end" fill="#A1A1AA">ROTARY VULCAN // READY</text>
  </g>

  <!-- Target Rings -->
  <circle cx="300" cy="400" r="180" fill="none" stroke="#00E5FF" stroke-dasharray="10 15" opacity="0.3" />
  <circle cx="300" cy="400" r="260" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.2" />
</svg>
